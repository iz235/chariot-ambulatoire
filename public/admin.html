<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Admin — Gestion Infirmiers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            width: 360px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .login-card input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .app {
            display: none;
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            color: #1e293b;
        }

        .header span {
            font-size: 13px;
            background: #fee2e2;
            color: #991b1b;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
            font-size: 12px;
            padding: 4px 10px;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .status {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
        }

        .status.success {
            background: #f0fdf4;
            color: #166534;
            border-left: 4px solid #22c55e;
        }

        .status.error {
            background: #fef2f2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f8fafc;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .empty {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- LOGIN ADMIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div style="font-size:48px; margin-bottom:12px;">🔐</div>
            <h1>Administration</h1>
            <p>Accès réservé aux administrateurs</p>
            <input type="password" id="adminKey" placeholder="Clé d'administration"
                onkeydown="if(event.key==='Enter') adminLogin()">
            <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Se connecter</button>
            <div id="loginErr" class="status error" style="display:none; margin-top:12px;"></div>
        </div>
    </div>

    <!-- APP -->
    <div class="app" id="appArea">
        <div class="header">
            <h1>🏥 Gestion des Infirmiers</h1>
            <span>🔒 ADMIN</span>
        </div>

        <!-- Formulaire ajout -->
        <div class="card">
            <h2>➕ Ajouter un Infirmier</h2>
            <form onsubmit="addNurse(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nom *</label>
                        <input type="text" id="n-last" placeholder="Dupont" required>
                    </div>
                    <div class="form-group">
                        <label>Prénom *</label>
                        <input type="text" id="n-first" placeholder="Marie" required>
                    </div>
                    <div class="form-group">
                        <label>ID Infirmier * (ex: INF003)</label>
                        <input type="text" id="n-id" placeholder="INF003" required style="text-transform:uppercase;">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe *</label>
                        <input type="password" id="n-pwd" placeholder="••••••••" required>
                    </div>
                </div>
                <div style="margin-top:16px; display:flex; gap:12px; align-items:center;">
                    <button type="submit" class="btn btn-primary">💾 Créer le compte</button>
                    <div id="addStatus" class="status" style="display:none; flex:1; margin:0;"></div>
                </div>
            </form>
        </div>

        <!-- Liste infirmiers -->
        <div class="card">
            <h2>👥 Comptes existants</h2>
            <div id="nurseTable">
                <div class="empty">Chargement...</div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_KEY_HEADER = 'x-admin-key';
        let adminKey = '';

        function adminLogin() {
            const key = document.getElementById('adminKey').value.trim();
            if (!key) return;

            fetch('/admin/nurses', { headers: { [ADMIN_KEY_HEADER]: key } })
                .then(r => {
                    if (r.status === 403) throw new Error("Clé incorrecte");
                    return r.json();
                })
                .then(data => {
                    adminKey = key;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appArea').style.display = 'block';
                    renderTable(data);
                })
                .catch(e => {
                    const err = document.getElementById('loginErr');
                    err.textContent = "❌ " + e.message;
                    err.style.display = 'block';
                });
        }

        function loadNurses() {
            fetch('/admin/nurses', { headers: { [ADMIN_KEY_HEADER]: adminKey } })
                .then(r => r.json())
                .then(renderTable);
        }

        function renderTable(nurses) {
            const div = document.getElementById('nurseTable');
            if (!nurses.length) { div.innerHTML = '<div class="empty">Aucun infirmier enregistré.</div>'; return; }
            div.innerHTML = `
      <table>
        <thead><tr><th>ID</th><th>Nom</th><th>Prénom</th><th>Créé le</th><th>Action</th></tr></thead>
        <tbody>${nurses.map(n => `
          <tr>
            <td><span class="badge">${n.nurse_id}</span></td>
            <td>${n.last_name}</td>
            <td>${n.first_name}</td>
            <td style="color:#94a3b8; font-size:12px;">${new Date(n.created_at).toLocaleDateString()}</td>
            <td><button class="btn btn-danger" onclick="deleteNurse('${n.nurse_id}')">🗑️ Supprimer</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`;
        }

        async function addNurse(e) {
            e.preventDefault();
            const statusEl = document.getElementById('addStatus');
            const payload = {
                nurse_id: document.getElementById('n-id').value.trim().toUpperCase(),
                last_name: document.getElementById('n-last').value.trim(),
                first_name: document.getElementById('n-first').value.trim(),
                password: document.getElementById('n-pwd').value.trim()
            };

            try {
                const res = await fetch('/admin/nurses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [ADMIN_KEY_HEADER]: adminKey },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                statusEl.className = 'status success';
                statusEl.textContent = `✅ Infirmier "${payload.nurse_id}" créé !`;
                statusEl.style.display = 'block';
                e.target.reset();
                loadNurses();
            } catch (err) {
                statusEl.className = 'status error';
                statusEl.textContent = `❌ ${err.message}`;
                statusEl.style.display = 'block';
            }
            setTimeout(() => statusEl.style.display = 'none', 4000);
        }

        async function deleteNurse(id) {
            if (!confirm(`Supprimer l'infirmier ${id} ?`)) return;
            const res = await fetch(`/admin/nurses/${id}`, {
                method: 'DELETE',
                headers: { [ADMIN_KEY_HEADER]: adminKey }
            });
            if (res.ok) loadNurses();
        }
    </script>
</body>

</html>
